<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9d45c">
  <title>周年記念 メイドさんアクキーガチャ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <div class="orientation-warning" id="orientationWarning">
      iPadを縦向きにしてお楽しみください
    </div>

    <section class="screen screen-idle is-active" id="idleScreen" aria-label="ガチャ待機画面">
      <header class="hero-title" id="adminTapTarget">
        <p>周年記念</p>
        <h1>メイドさん<br>アクキーガチャ</h1>
        <strong>1回 1,000円</strong>
      </header>

      <div class="machine-stage" aria-hidden="true">
        <div class="gacha-machine" id="gachaMachine">
          <div class="machine-body image-fallback" data-img="img/gacha/machine_body.png"></div>
          <div class="machine-window image-fallback" data-img="img/gacha/machine_window.png">
            <div class="capsule-field" id="capsuleField"></div>
          </div>
          <div class="machine-chute"></div>
          <div class="machine-tray"></div>
          <button class="machine-handle image-fallback" id="machineHandle" data-img="img/gacha/handle.png" tabindex="-1" aria-hidden="true">
            <span></span>
          </button>
          <div class="drop-capsule" id="dropCapsule"></div>
        </div>
      </div>

      <button class="primary-button gacha-button" id="gachaButton">
        <span>ガチャを回す！</span>
      </button>

      <footer class="idle-footer">
        <p id="drawCount">今回のガチャ: 0回</p>
        <button class="quiet-button" id="nextGuestButton">次のご主人様</button>
      </footer>
    </section>

    <section class="screen screen-result" id="resultScreen" aria-label="結果画面">
      <div class="result-rays"></div>
      <div class="result-card">
        <div class="maid-frame">
          <img id="maidImage" alt="" decoding="async">
          <div class="maid-placeholder" id="maidPlaceholder"></div>
        </div>
        <h2 id="resultMessage">メイドさんが当たりました！</h2>
        <button class="primary-button" id="againButton">もう一度ガチャを回す</button>
      </div>
    </section>

    <aside class="history-panel" id="historyPanel" aria-label="履歴">
      <h2>履歴</h2>
      <ol id="historyList"></ol>
    </aside>

    <div class="focus-layer" id="focusLayer" aria-hidden="true">
      <div class="focus-dim"></div>
      <div class="focus-capsule" id="focusCapsule">
        <div class="capsule-shell capsule-top" id="capsuleTop"></div>
        <div class="capsule-shell capsule-bottom" id="capsuleBottom"></div>
        <div class="inner-light"></div>
      </div>
      <div class="focus-maid" id="focusMaid">
        <div class="focus-rays"></div>
        <img id="focusMaidImage" alt="">
        <div class="focus-placeholder" id="focusPlaceholder"></div>
      </div>
      <div class="focus-message" id="focusMessage"></div>
    </div>

    <button class="skip-button" id="skipButton">演出をスキップ</button>
    <div class="flash" id="flash"></div>
    <div class="particle-layer" id="particleLayer" aria-hidden="true"></div>

    <section class="admin-panel" id="adminPanel" aria-label="管理者設定">
      <div class="admin-card">
        <header>
          <h2>管理者設定</h2>
          <button class="icon-button" id="closeAdminButton" aria-label="閉じる">×</button>
        </header>
        <dl>
          <div><dt>登録人数</dt><dd id="maidCount">0人</dd></div>
          <div><dt>現在の回数</dt><dd id="adminDrawCount">0回</dd></div>
        </dl>
        <div class="maid-list" id="maidList"></div>
        <label class="toggle-row">
          <input type="checkbox" id="soundToggle">
          <span>効果音 ON</span>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="skipToggle">
          <span>スキップ機能 ON</span>
        </label>
        <button class="danger-button" id="resetHistoryButton">履歴を削除</button>
        <button class="quiet-button" id="testAnimationButton">演出テスト</button>
      </div>
    </section>

    <dialog id="confirmDialog">
      <form method="dialog">
        <p>現在のガチャ履歴を削除して、次のご主人様のガチャを開始しますか？</p>
        <menu>
          <button value="cancel">戻る</button>
          <button value="confirm" class="primary-small">はい、次のご主人様へ</button>
        </menu>
      </form>
    </dialog>
  </main>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
